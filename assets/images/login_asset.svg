<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="200" height="200" fill="#ffffff00"/>

    <!-- Glow effect -->
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Bottom line -->
    <line x1="30" y1="155" x2="180" y2="155"
        stroke="#8B0000" stroke-width="2"
        filter="url(#glow)"/>

    <!-- Left building -->
    <path d="M80 45 H115 L130 50 V95 H115 V155 H80 Z"
        stroke="#8B0000"
        stroke-width="2.5"
        fill="none"
        filter="url(#glow)"/>

    <!-- Right building -->
    <path d="M115 75 H160 V155 H115 Z"
        stroke="#8B0000"
        stroke-width="2.5"
        fill="none"
        filter="url(#glow)"/>

    <!-- Left building windows -->
    <rect x="90" y="58" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="105" y="58" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="90" y="80" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="105" y="80" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="90" y="102" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="105" y="102" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="90" y="124" width="7" height="10" stroke="#8B0000" fill="none"/>
    <rect x="105" y="124" width="7" height="10" stroke="#8B0000" fill="none"/>

    <!-- Right building windows -->
    <rect x="125" y="88" width="8" height="10" stroke="#8B0000" fill="none"/>
    <rect x="142" y="88" width="8" height="10" stroke="#8B0000" fill="none"/>
    <rect x="125" y="110" width="8" height="10" stroke="#8B0000" fill="none"/>
    <rect x="142" y="110" width="8" height="10" stroke="#8B0000" fill="none"/>

    <!-- Doors -->
    <rect x="98" y="132" width="10" height="23"
        stroke="#8B0000" fill="none"/>
    <rect x="132" y="132" width="10" height="23"
        stroke="#8B0000" fill="none"/>

    <!-- Tree -->
    <circle cx="48" cy="118" r="14"
        stroke="#8B0000"
        stroke-width="2.5"
        fill="none"
        filter="url(#glow)"/>
    <line x1="48" y1="132" x2="48" y2="155"
        stroke="#8B0000"
        stroke-width="2.5"/>
    <line x1="48" y1="120" x2="42" y2="114"
        stroke="#8B0000"
        stroke-width="2"/>
    <line x1="48" y1="120" x2="54" y2="114"
        stroke="#8B0000"
        stroke-width="2"/>
</svg>